# GitHub Action see https://github.com/shivammathur/setup-php
name: Unit Tests
on: [ push, pull_request ]
jobs:
    unit_tests:
        name: GPWebPay (PHP ${{ matrix.php-versions }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # composer.json supports PHP ^8.1, but roave/security-advisories conflicts with every PHP 8.1 release
                # (end of life), so dependencies resolve only on PHP releases with security fixes.
                php-versions: [ '8.2', '8.3', '8.4', '8.5' ]
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: Setup PHP, with composer and extensions
                uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
                with:
                    php-version: ${{ matrix.php-versions }}
                    extensions: openssl, mbstring, json, intl, iconv, xml, tokenizer
                    coverage: xdebug #optional
                    tools: composer:v2

            -   name: Composer dependencies
                uses: "ramsey/composer-install@v3"

            -   name: Run Tests
                run: vendor/bin/tester tests -s -C --coverage ./coverage.xml --coverage-src ./src

            -   name: Upload Codecov
                uses: "codecov/codecov-action@v5"
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}
                    files: ./coverage.xml
                    slug: Pixidos/GPWebpay
