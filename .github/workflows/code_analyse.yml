# GitHub Action see https://github.com/shivammathur/setup-php
name: Code Analyse
on: [push, pull_request]
jobs:
    code_quality:
        name: GPWebPay (PHP ${{ matrix.php-versions }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # every PHP version supported by composer.json (^8.2), with stable Nette 3
                php-versions: [ '8.2', '8.3', '8.4', '8.5' ]
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: Setup PHP, with composer and extensions
                uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
                with:
                    php-version: ${{ matrix.php-versions }}
                    extensions: openssl
                    coverage: none #optional
                    tools: composer:v2
            -   name: Composer dependencies
                uses: "ramsey/composer-install@v3"

            -   name: Check dependencies for security advisories
                run: composer audit

            -   name: Run Codestyle chceck
                run: php vendor/bin/phpcs -p

            -   name: Run PHPStan
                run: php vendor/bin/phpstan analyse
